{% extends "auth_base.html" %}

{% block title %}Login - Engrena{% endblock %}

{% block content %}
<div class="mb-6 text-center">
    <h1 class="text-xl font-bold text-gray-900">Acesse o sistema</h1>
    <p class="mt-1 text-sm text-gray-500">Entre com suas credenciais para continuar.</p>
</div>

<form class="space-y-5" action="{{ url_for('auth.login') }}" method="POST">
    <div>
        <label for="username" class="label">Usuário</label>
        <input id="username" name="username" type="text" required autocomplete="username" class="input">
    </div>

    <div>
        <label for="password" class="label">Senha</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" class="input">
    </div>

    <button type="submit" class="btn btn-primary w-full">
        <i class="fas fa-right-to-bracket"></i>Entrar
    </button>
</form>

<p class="mt-6 text-center text-sm text-gray-500">
    Não tem uma conta?
    <a href="{{ url_for('auth.register') }}" class="font-semibold text-primary-600 hover:text-primary-700">Cadastre-se aqui</a>
</p>
{% endblock %}
