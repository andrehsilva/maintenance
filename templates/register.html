{% extends "auth_base.html" %}

{% block title %}Cadastro - Engrena{% endblock %}

{% block content %}
<div class="mb-6 text-center">
    <h1 class="text-xl font-bold text-gray-900">Crie sua conta de operador</h1>
    <p class="mt-1 text-sm text-gray-500">Preencha os dados abaixo para se registrar.</p>
</div>

<form class="space-y-5" action="{{ url_for('auth.register') }}" method="POST">
    <div>
        <label for="name" class="label">Nome Completo</label>
        <input id="name" name="name" type="text" required class="input">
    </div>

    <div>
        <label for="username" class="label">Usuário (para login)</label>
        <input id="username" name="username" type="text" required class="input">
    </div>

    <div>
        <label for="email" class="label">Email</label>
        <input id="email" name="email" type="email" required class="input">
    </div>

    <div>
        <label for="cpf" class="label">CPF</label>
        <input id="cpf" name="cpf" type="text" required class="input">
    </div>

    <div>
        <label for="password" class="label">Senha</label>
        <input id="password" name="password" type="password" required class="input">
    </div>

    <button type="submit" class="btn btn-primary w-full">
        <i class="fas fa-user-plus"></i>Cadastrar
    </button>
</form>

<p class="mt-6 text-center text-sm text-gray-500">
    Já tem uma conta?
    <a href="{{ url_for('auth.login') }}" class="font-semibold text-primary-600 hover:text-primary-700">Faça login</a>
</p>
{% endblock %}
